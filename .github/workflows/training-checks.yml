name: Training pipeline checks

on:
  push:
    branches: [main]
    paths:
      - "training/**"
      - ".github/workflows/training-checks.yml"
  pull_request:
    paths:
      - "training/**"
      - ".github/workflows/training-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install audit dependency
        run: python -m pip install numpy
      - name: Test landmark dimension audit
        run: python training/test_audit_libras_eqt_npy.py
      - name: Test safe UECE continuous package inspector
        run: python training/test_inspect_uece_continuous_package.py
      - name: Test static NPY pickle inspection
        run: python training/test_inspect_npy_pickle_static.py
      - name: Check Python syntax and notebook structure
        run: |
          python -m compileall -q training
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path("training/SINAL_LIBRAS_Auditoria_UECE.ipynb")
          notebook = json.loads(path.read_text(encoding="utf-8"))
          assert notebook.get("nbformat") == 4
          assert notebook.get("cells"), "Notebook sem células"
          assert all(cell.get("cell_type") in {"markdown", "code"} for cell in notebook["cells"])
          print("Notebook JSON válido:", len(notebook["cells"]), "células")
          PY
      - name: Smoke-test JSONL validator
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          frame = [0.0] * 318
          rows = [
              {"sample_id":"a1","signer_id":"p1","split":"train","portuguese_text":"bom dia","frames":[frame,frame]},
              {"sample_id":"b1","signer_id":"p2","split":"dev","portuguese_text":"boa tarde","frames":[frame,frame]},
              {"sample_id":"c1","signer_id":"p3","split":"test","portuguese_text":"boa noite","frames":[frame,frame]},
          ]
          Path("/tmp/sinal-smoke.jsonl").write_text(
              "\n".join(json.dumps(row) for row in rows), encoding="utf-8"
          )
          PY
          python training/validate_continuous_jsonl.py /tmp/sinal-smoke.jsonl --expected-dim 318
          # Dimensão desconhecida deve ser rejeitada.
          python - <<'PY'
          import json
          from pathlib import Path
          frame = [0.0] * 126
          row = {"sample_id":"bad-dim","signer_id":"p1","split":"train","portuguese_text":"teste","frames":[frame,frame]}
          Path("/tmp/sinal-bad-dim.jsonl").write_text(json.dumps(row), encoding="utf-8")
          PY
          if python training/validate_continuous_jsonl.py /tmp/sinal-bad-dim.jsonl; then
            echo "ERRO: dimensão 126 foi aceita pelo pipeline contínuo"
            exit 1
          else
            echo "OK: dimensão incompatível foi rejeitada"
          fi
          # Um mesmo participante não pode aparecer em partições diferentes.
          python - <<'PY'
          import json
          from pathlib import Path
          frame = [0.0] * 318
          rows = [
              {"sample_id":"a1","signer_id":"same-person","split":"train","portuguese_text":"bom dia","frames":[frame,frame]},
              {"sample_id":"b1","signer_id":"same-person","split":"dev","portuguese_text":"boa tarde","frames":[frame,frame]},
          ]
          Path("/tmp/sinal-leak.jsonl").write_text(
              "\n".join(json.dumps(row) for row in rows), encoding="utf-8"
          )
          PY
          if python training/validate_continuous_jsonl.py /tmp/sinal-leak.jsonl --expected-dim 318; then
            echo "ERRO: vazamento de participante não foi detectado"
            exit 1
          else
            echo "OK: vazamento de participante foi detectado"
          fi
